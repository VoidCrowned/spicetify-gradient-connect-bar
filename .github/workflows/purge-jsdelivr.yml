name: Purge jsDelivr

# The Marketplace loads the extension from jsDelivr @main, which caches the branch → commit
# resolution for hours. After every change and release this purges the files it serves
# and waits for the CDN to serve the pushed VERSION (.github/scripts/purge-jsdelivr.sh).
#
# No schedule here: GitHub disables a whole workflow with a schedule after 60 days without
# repository activity, which would take the push and release purges down with it. The
# 3-hourly heal lives in cdn-heal.yml, and every push and release re-enables it in case a
# quiet stretch switched it off.

on:
  push:
    branches: [main]
    paths:
      - gradientConnectBar.js
      - manifest.json
      - README.md
      - preview.png
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: write # gh workflow enable

concurrency:
  group: purge-jsdelivr

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Re-enable the scheduled heal
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable cdn-heal.yml || echo "::warning::Couldn't re-enable cdn-heal.yml"

      - name: Purge and wait for the CDN
        env:
          REPO: ${{ github.repository }}
        run: bash .github/scripts/purge-jsdelivr.sh
