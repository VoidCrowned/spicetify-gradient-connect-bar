# Issue hygiene: strips the "Generated by Claude Code" footer from issues, comments and
# milestone descriptions, and
# ticks the remaining checkboxes when an issue is closed as completed (except lines marked as
# superseded or moved). Run it manually ("Run workflow") to sweep every issue, comment and
# milestone.
# Edits made with GITHUB_TOKEN don't trigger new workflow runs, so this can't loop.
name: Issue hygiene

on:
  issues:
    types: [opened, edited, closed]
  issue_comment:
    types: [created, edited]
  milestone:
    types: [created, edited]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // Trailing footer; bodies edited in the web UI use CRLF.
            const FOOTER = /\s*\r?\n---\r?\n_Generated (by|with) \[Claude Code\]\(https:\/\/claude\.ai\/code\)_\s*$/;
            const stripFooter = (text) => (text ?? "").replace(FOOTER, "");

            // "- [ ] " / "* [ ] " → ticked, except superseded (~~) or postponed (moved to …) lines.
            const KEEP = /~~|➜ moved to|moved to #/;
            const tickBoxes = (text) =>
              text.split("\n").map((line) =>
                KEEP.test(line) ? line : line.replace(/^(\s*[-*] )\[ \] /, "$1[x] ")
              ).join("\n");

            const completed = (issue) => issue.state === "closed" && issue.state_reason === "completed";
            const { owner, repo } = context.repo;

            // Each returns true if it changed something; the API is only called on a change.
            async function fixIssue(issue, tick) {
              if (issue.pull_request) return false; // PR descriptions are out of scope (issues: write only)
              let body = stripFooter(issue.body);
              if (tick && completed(issue)) body = tickBoxes(body);
              if (body === (issue.body ?? "")) return false;
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              core.info(`#${issue.number}: body updated`);
              return true;
            }
            async function fixComment(comment) {
              if (comment.html_url.includes("/pull/")) return false;
              const body = stripFooter(comment.body);
              if (body === comment.body) return false;
              await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
              core.info(`comment ${comment.id}: footer removed`);
              return true;
            }
            async function fixMilestone(milestone) {
              const description = stripFooter(milestone.description);
              if (description === (milestone.description ?? "")) return false;
              await github.rest.issues.updateMilestone({ owner, repo, milestone_number: milestone.number, description });
              core.info(`milestone ${milestone.title}: footer removed`);
              return true;
            }

            if (context.eventName === "workflow_dispatch") {
              // Sweep: every issue and milestone (any state) and every issue comment.
              let bodies = 0, comments = 0, descriptions = 0;
              const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "all", per_page: 100 });
              for (const issue of issues) if (await fixIssue(issue, true)) bodies++;
              const all = await github.paginate(github.rest.issues.listCommentsForRepo, { owner, repo, per_page: 100 });
              for (const comment of all) if (await fixComment(comment)) comments++;
              const milestones = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: "all", per_page: 100 });
              for (const milestone of milestones) if (await fixMilestone(milestone)) descriptions++;
              core.notice(`Sweep: ${bodies} of ${issues.length} issue bodies, ${comments} of ${all.length} comments and ${descriptions} of ${milestones.length} milestone descriptions changed.`);
            } else if (context.eventName === "milestone") {
              await fixMilestone(context.payload.milestone);
            } else if (context.eventName === "issue_comment") {
              if (!context.payload.issue.pull_request) await fixComment(context.payload.comment);
            } else {
              // issues: opened / edited / closed. The payload issue carries state and state_reason,
              // so boxes are only ticked on close as completed (never not_planned, never on edit).
              await fixIssue(context.payload.issue, context.payload.action === "closed");
            }
